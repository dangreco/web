---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length
# yamllint disable rule:comments
name: PR
# PRs are squash-merged, so the PR title becomes the commit subject on dev and
# is what release-please parses to decide the next version. A non-conventional
# title would silently produce no version bump, so it is a required check.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            refactor
            docs
            build
            chore
            ci
